<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A38" />
      <stop offset="60%" stop-color="#2D4356" />
      <stop offset="100%" stop-color="#435B66" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E2B" />
      <stop offset="100%" stop-color="#112419" />
    </linearGradient>
    <linearGradient id="bluePool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="#1E242B"/>
  <!-- Expressways / Arterial Roads -->
  <path d="M50 500 Q 450 300, 850 100" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <text x="700" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="url(#goldGrad)">YAMUNA EXPRESSWAY</text>

  <!-- Key Landmarks -->
  <!-- Landmark 1: Project Site -->
  <circle cx="450" cy="300" r="16" fill="#D4AF37" filter="url(#shadow)"/>
  <circle cx="450" cy="300" r="8" fill="#FFFFFF"/>
  <text x="450" y="340" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">NORTHWIND ESTATE</text>
  <text x="450" y="360" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#C5A059" text-anchor="middle">Sector 22D</text>

  <!-- Landmark 2: Noida Intl Airport -->
  <circle cx="750" cy="180" r="12" fill="#38BDF8"/>
  <text x="750" y="215" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle">Noida International Airport (Jewar)</text>

  <!-- Landmark 3: Greater Noida Hub -->
  <circle cx="200" cy="420" r="12" fill="#4ADE80"/>
  <text x="200" y="455" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">Greater Noida Commercial Corridor</text>

  <!-- Title Overlay -->
  <rect x="40" y="40" width="320" height="70" fill="#14181E" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="60" y="70" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#FFFFFF">LOCATION MAP</text>
  <text x="60" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Sector 22D, Yamuna Expressway</text>

</svg>