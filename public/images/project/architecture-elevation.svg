<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A38" />
      <stop offset="60%" stop-color="#2D4356" />
      <stop offset="100%" stop-color="#435B66" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E2B" />
      <stop offset="100%" stop-color="#112419" />
    </linearGradient>
    <linearGradient id="bluePool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#darkBg)"/>
  <rect x="250" y="80" width="300" height="480" fill="#242B35" rx="8" stroke="url(#goldGrad)" stroke-width="1"/>
  <!-- Balconies & Glass Facade -->
  <g fill="#C5A059" opacity="0.3">
    <rect x="280" y="120" width="240" height="15" rx="3"/>
    <rect x="280" y="170" width="240" height="15" rx="3"/>
    <rect x="280" y="220" width="240" height="15" rx="3"/>
    <rect x="280" y="270" width="240" height="15" rx="3"/>
    <rect x="280" y="320" width="240" height="15" rx="3"/>
    <rect x="280" y="370" width="240" height="15" rx="3"/>
    <rect x="280" y="420" width="240" height="15" rx="3"/>
  </g>
  <text x="400" y="520" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">MODERN HIGH-RISE ARCHITECTURE</text>
  <text x="400" y="545" font-family="'Inter', sans-serif" font-size="12" fill="url(#goldGrad)" text-anchor="middle">Premium Materials &amp; Ventilation Design</text>

</svg>