<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E2B" />
      <stop offset="100%" stop-color="#112419" />
    </linearGradient>
    <linearGradient id="bluePool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#141920"/>

  <!-- Site boundary -->
  <rect x="50" y="50" width="800" height="500" rx="12" fill="#1C242E"/>

  <!-- Grid lines -->
  <line x1="50" y1="183" x2="850" y2="183" stroke="#2A3540" stroke-width="1"/>
  <line x1="50" y1="317" x2="850" y2="317" stroke="#2A3540" stroke-width="1"/>
  <line x1="50" y1="450" x2="850" y2="450" stroke="#2A3540" stroke-width="1"/>
  <line x1="233" y1="50" x2="233" y2="550" stroke="#2A3540" stroke-width="1"/>
  <line x1="450" y1="50" x2="450" y2="550" stroke="#2A3540" stroke-width="1"/>
  <line x1="667" y1="50" x2="667" y2="550" stroke="#2A3540" stroke-width="1"/>

  <!-- Central green park -->
  <ellipse cx="450" cy="300" rx="160" ry="120" fill="#1E3E2B" opacity="0.6"/>
  <ellipse cx="450" cy="300" rx="140" ry="100" fill="#264A34" opacity="0.5"/>
  <!-- Park path ring -->
  <ellipse cx="450" cy="300" rx="160" ry="120" fill="none" stroke="#ACC78C" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4"/>

  <!-- Tower Block A (NW) -->
  <rect x="100" y="100" width="90" height="120" rx="4" fill="#2C4B6E" opacity="0.85"/>
  <rect x="100" y="100" width="90" height="120" rx="4" fill="none" stroke="#4A7FAF" stroke-width="1"/>
  <text x="145" y="168" font-family="sans-serif" font-size="10" fill="#8BB8D8" text-anchor="middle" font-weight="600">TOWER A</text>

  <!-- Tower Block B (NE) -->
  <rect x="710" y="100" width="90" height="120" rx="4" fill="#2C4B6E" opacity="0.85"/>
  <rect x="710" y="100" width="90" height="120" rx="4" fill="none" stroke="#4A7FAF" stroke-width="1"/>
  <text x="755" y="168" font-family="sans-serif" font-size="10" fill="#8BB8D8" text-anchor="middle" font-weight="600">TOWER B</text>

  <!-- Tower Block C (SW) -->
  <rect x="100" y="380" width="90" height="120" rx="4" fill="#2C4B6E" opacity="0.85"/>
  <rect x="100" y="380" width="90" height="120" rx="4" fill="none" stroke="#4A7FAF" stroke-width="1"/>
  <text x="145" y="448" font-family="sans-serif" font-size="10" fill="#8BB8D8" text-anchor="middle" font-weight="600">TOWER C</text>

  <!-- Tower Block D (SE) -->
  <rect x="710" y="380" width="90" height="120" rx="4" fill="#2C4B6E" opacity="0.85"/>
  <rect x="710" y="380" width="90" height="120" rx="4" fill="none" stroke="#4A7FAF" stroke-width="1"/>
  <text x="755" y="448" font-family="sans-serif" font-size="10" fill="#8BB8D8" text-anchor="middle" font-weight="600">TOWER D</text>

  <!-- Clubhouse (North center) -->
  <rect x="370" y="80" width="160" height="60" rx="6" fill="#3A2E1A" opacity="0.9"/>
  <rect x="370" y="80" width="160" height="60" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="450" y="115" font-family="sans-serif" font-size="9" fill="#D4AF37" text-anchor="middle" font-weight="700">CLUBHOUSE</text>

  <!-- Pool (South) -->
  <rect x="380" y="455" width="140" height="60" rx="8" fill="#0F4C81" opacity="0.7"/>
  <rect x="380" y="455" width="140" height="60" rx="8" fill="none" stroke="#1B9AAA" stroke-width="1"/>
  <text x="450" y="490" font-family="sans-serif" font-size="9" fill="#7ED8F6" text-anchor="middle" font-weight="600">POOL DECK</text>

  <!-- Internal roads -->
  <path d="M 220 50 L 220 550" stroke="#ACC78C" stroke-width="3" opacity="0.15"/>
  <path d="M 680 50 L 680 550" stroke="#ACC78C" stroke-width="3" opacity="0.15"/>
  <path d="M 50 170 L 850 170" stroke="#ACC78C" stroke-width="3" opacity="0.15"/>
  <path d="M 50 430 L 850 430" stroke="#ACC78C" stroke-width="3" opacity="0.15"/>

  <!-- Compass rose (bottom right) -->
  <g transform="translate(800, 490)">
    <circle cx="0" cy="0" r="28" fill="#1C242E" stroke="#ACC78C" stroke-width="1" opacity="0.8"/>
    <polygon points="0,-20 4,-6 -4,-6" fill="#D4AF37"/>
    <polygon points="0,20 4,6 -4,6" fill="#5E7168"/>
    <text x="0" y="-22" font-family="sans-serif" font-size="8" fill="#D4AF37" text-anchor="middle" font-weight="700">N</text>
  </g>
</svg>