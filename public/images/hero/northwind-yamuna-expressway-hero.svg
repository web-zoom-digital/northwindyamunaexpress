<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A38" />
      <stop offset="60%" stop-color="#2D4356" />
      <stop offset="100%" stop-color="#435B66" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E2B" />
      <stop offset="100%" stop-color="#112419" />
    </linearGradient>
    <linearGradient id="bluePool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#skyGrad)"/>
  <!-- Stars / Ambient Grid -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
  </g>
  <!-- Architectural Towers Silhouette with Illuminated Windows -->
  <!-- Tower 1 -->
  <rect x="200" y="160" width="180" height="540" fill="#141920" rx="4"/>
  <rect x="210" y="150" width="160" height="20" fill="url(#goldGrad)" opacity="0.8"/>
  <!-- Windows -->
  <g fill="#FDF0D5" opacity="0.85">
    <rect x="225" y="190" width="18" height="12" rx="2"/>
    <rect x="255" y="190" width="18" height="12" rx="2"/>
    <rect x="305" y="190" width="18" height="12" rx="2"/>
    <rect x="335" y="190" width="18" height="12" rx="2"/>
    
    <rect x="225" y="230" width="18" height="12" rx="2"/>
    <rect x="255" y="230" width="18" height="12" rx="2"/>
    <rect x="305" y="230" width="18" height="12" rx="2"/>
    <rect x="335" y="230" width="18" height="12" rx="2"/>

    <rect x="225" y="270" width="18" height="12" rx="2"/>
    <rect x="255" y="270" width="18" height="12" rx="2"/>
    <rect x="305" y="270" width="18" height="12" rx="2"/>
    <rect x="335" y="270" width="18" height="12" rx="2"/>

    <rect x="225" y="310" width="18" height="12" rx="2"/>
    <rect x="255" y="310" width="18" height="12" rx="2"/>
    <rect x="305" y="310" width="18" height="12" rx="2"/>
    <rect x="335" y="310" width="18" height="12" rx="2"/>

    <rect x="225" y="350" width="18" height="12" rx="2"/>
    <rect x="255" y="350" width="18" height="12" rx="2"/>
    <rect x="305" y="350" width="18" height="12" rx="2"/>
    <rect x="335" y="350" width="18" height="12" rx="2"/>
  </g>

  <!-- Tower 2 Center Icon -->
  <rect x="420" y="100" width="220" height="600" fill="#0F1318" rx="4"/>
  <rect x="430" y="85" width="200" height="25" fill="url(#goldGrad)"/>
  <g fill="#FFD700" opacity="0.9">
    <rect x="450" y="130" width="22" height="14" rx="2"/>
    <rect x="485" y="130" width="22" height="14" rx="2"/>
    <rect x="555" y="130" width="22" height="14" rx="2"/>
    <rect x="590" y="130" width="22" height="14" rx="2"/>
    
    <rect x="450" y="170" width="22" height="14" rx="2"/>
    <rect x="485" y="170" width="22" height="14" rx="2"/>
    <rect x="555" y="170" width="22" height="14" rx="2"/>
    <rect x="590" y="170" width="22" height="14" rx="2"/>

    <rect x="450" y="210" width="22" height="14" rx="2"/>
    <rect x="485" y="210" width="22" height="14" rx="2"/>
    <rect x="555" y="210" width="22" height="14" rx="2"/>
    <rect x="590" y="210" width="22" height="14" rx="2"/>
  </g>

  <!-- Tower 3 -->
  <rect x="680" y="180" width="190" height="520" fill="#141920" rx="4"/>
  <rect x="690" y="170" width="170" height="18" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Podium & Landscaped Forecourt -->
  <rect x="0" y="580" width="1200" height="120" fill="#18241D"/>
  <path d="M0 600 Q 300 550, 600 600 T 1200 580 L 1200 700 L 0 700 Z" fill="#0E1812" opacity="0.9"/>
  <!-- Ambient pool glow -->
  <ellipse cx="600" cy="650" rx="250" ry="25" fill="#1B9AAA" opacity="0.4" filter="url(#shadow)"/>
  <text x="600" y="655" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">LUXURY RESIDENCES • SECTOR 22D YAMUNA EXPRESSWAY</text>

</svg>