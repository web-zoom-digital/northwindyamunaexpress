<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A38" />
      <stop offset="60%" stop-color="#2D4356" />
      <stop offset="100%" stop-color="#435B66" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E2B" />
      <stop offset="100%" stop-color="#112419" />
    </linearGradient>
    <linearGradient id="bluePool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#greenGrad)"/>
  <circle cx="600" cy="350" r="300" fill="#2E5A44" opacity="0.2"/>
  <rect x="350" y="180" width="500" height="340" rx="12" fill="#1A1E24" opacity="0.9" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="270" font-family="'Playfair Display', serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">NWE SANCTUARY</text>
  <text x="600" y="320" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">3 &amp; 4 BHK ULTRA LOW-DENSITY RESIDENCES</text>
  <line x1="450" y1="360" x2="750" y2="360" stroke="#C5A059" stroke-width="1" opacity="0.6"/>
  <text x="600" y="410" font-family="'Inter', sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">Sector 22D, Yamuna Expressway, Greater Noida</text>
  <text x="600" y="445" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Adjacent to Upcoming Noida International Airport Corridor</text>

</svg>